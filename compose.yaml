name: tixora
services:
  gateway:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://gateway:8080/api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  backend:
    build: ./backend
    environment:
      APP_NAME: Tixora
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?Set APP_URL in deploy/.env}
      APP_KEY: ${APP_KEY:?Generate APP_KEY in deploy/.env}
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_DATABASE: ${DB_DATABASE:-tixora}
      DB_USERNAME: ${DB_USERNAME:-tixora}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "true"
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: lax
      SESSION_ENCRYPT: "true"
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-tixora}
      MYSQL_USER: ${DB_USERNAME:-tixora}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in deploy/.env}
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  app-storage:
  database-data:
